# CI for the dsh-web-search-ollama monorepo.
#
# Three independent jobs:
#
#   test          — on every push to main and every pull request:
#                   install (frozen lockfile), run the module-shape and
#                   provider-behavior tests, then rebuild the host package
#                   with tsc and fail if the committed index.js differs
#                   (the compiled output is checked in on purpose: the
#                   package ships zero-build).
#
#   release-tgz   — when a GitHub Release is published: pack both npm
#                   packages and attach the tarballs to that Release, so
#                   the README's tarball install channel always has
#                   current assets (`dsh plugin add <release .tgz URL>`).
#
#   npm-publish   — when a GitHub Release is published: publish both scoped
#                   packages (@jlvncn/…) to npmjs.org with provenance.
#                   Auth: npm trusted publishing (OIDC, token-free — the
#                   recommended path; configure it on each package's npmjs
#                   Settings page) or, as a fallback, the NPM_TOKEN
#                   repository secret when present. Versions that are
#                   already on the registry are skipped, so re-runs and
#                   local publishes don't fail the job.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Reads the packageManager field from the root package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          # The host package requires Node >= 20.3 (AbortSignal.any).
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test (module shape + provider behavior)
        run: pnpm test

      - name: Build sync check (committed index.js == tsc output)
        run: |
          pnpm build
          git diff --exit-code packages/dsh-web-search-ollama/index.js

  release-tgz:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack both packages
        run: |
          mkdir -p "$PWD/dist"
          pnpm --filter @jlvncn/dsh-web-search-ollama pack --pack-destination "$PWD/dist"
          pnpm --filter @jlvncn/dsh-web-search-ollama-client pack --pack-destination "$PWD/dist"
          ls -la dist/

      - name: Attach tarballs to the Release
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.tgz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm-publish:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance + trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          # npm trusted publishing needs npm >= 11.5.1; node 22 ships npm 10.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Ensure npm >= 11.5.1
        run: |
          npm --version
          npm install --global npm@11 --silent
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish both packages (trusted publishing, or NPM_TOKEN fallback)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$NPM_TOKEN" ]; then
            echo "::notice::Authenticating with the NPM_TOKEN secret."
            echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> "$HOME/.npmrc"
          else
            echo "::notice::No NPM_TOKEN — using npm trusted publishing (OIDC)."
            echo "If this fails with an auth error, add a Trusted Publisher"
            echo "(GitHub Actions / jlvncn / dsh-web-search-ollama / ci.yml,"
            echo "empty environment) on each package's npmjs.com Settings page."
          fi
          publish_one() { # $1 = package dir, $2 = package name
            local ver
            ver=$(node -p "require('./packages/$1/package.json').version")
            if npm view "$2@$ver" version >/dev/null 2>&1; then
              echo "$2@$ver is already on the registry — skipping."
              return 0
            fi
            echo "Publishing $2@$ver …"
            (cd "packages/$1" && npm publish --provenance --access public)
          }
          publish_one dsh-web-search-ollama @jlvncn/dsh-web-search-ollama
          publish_one dsh-web-search-ollama-client @jlvncn/dsh-web-search-ollama-client
