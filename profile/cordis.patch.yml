# =============================================================================
# @jlvncn/dsh-web-search-ollama — loader patch for a DeepSeek Harness profile
#
# Merge this file's entries into your profile's cordis.patch.yml
# ($DSH_HOME/profiles/<profile>/cordis.patch.yml), or let scripts/install.sh
# do it for you.
#
#   web-search-ollama          host half — registers the Ollama search &
#                                          fetch providers on ctx.web. Its
#                                          Config schema is what the built-in
#                                          plugin manager renders as the
#                                          "插件配置" form (harness >= 0.1.7).
#
#   web-search-ollama-client   browser half — provides the configure control
#                                          on the host row above: harness
#                                          >= 0.1.7 renders it only when this
#                                          package registers the keyed slot
#                                          `plugins.row.config` (key
#                                          `@jlvncn/dsh-web-search-ollama#web-search-ollama`).
#
# Requires both packages under the profile's node_modules:
#   $DSH_HOME/profiles/node_modules/@jlvncn/dsh-web-search-ollama/
#   $DSH_HOME/profiles/node_modules/@jlvncn/dsh-web-search-ollama-client/
# =============================================================================

# Use the Ollama-backed search provider instead of the built-in DeepSeek one.
#
# The host half registers ONLY the search provider by default; its Ollama fetch
# provider is opt-in via `config.enableFetchProvider: true`. The built-in
# generic `http` fetch provider works for any public URL without an API key, so
# the default config keeps fetch on `http` and pins it explicitly. (If you
# enable the Ollama fetch provider without pinning `fetchProvider`, dsh sees two
# usable fetch providers — "http" and "ollama" — and refuses to auto-select:
# "multiple usable web providers are registered".)
- id: web
  config:
    searchProvider: ollama
    fetchProvider: http

# The built-in DeepSeek search provider is replaced; keep it disabled.
- id: web-search-deepseek
  disabled: true

- insert:
    # Host half: Ollama-backed search & fetch provider. Mounted as a package
    # name (resolvable from the profile's node_modules) so the loader
    # inventory shows a proper name instead of a raw file path.
    - id: web-search-ollama
      name: '@jlvncn/dsh-web-search-ollama'
      config:
        baseURL: https://ollama.com
        searchPath: /api/web_search
        fetchPath: /api/web_fetch
        apiKeyEnv: OLLAMA_API_KEY

    # Browser half: the Plugins page configure control for the row above. Must
    # be mounted as a package name so the client-modules scanner finds its
    # `dsh.client` declaration and serves its `./client` bundle.
    - id: web-search-ollama-client
      name: '@jlvncn/dsh-web-search-ollama-client'
